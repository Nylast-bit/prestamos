services:

  backend:
    build:
      context: ./prestamosapi
      dockerfile: Dockerfile
    container_name: prestamos-backend
    env_file:
      - ./prestamosapi/.env
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
    restart: unless-stopped

  frontend:
    build:
      context: ./prestamosapp
      dockerfile: Dockerfile
    container_name: prestamos-frontend
    env_file:
      - ./prestamosapp/.env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped